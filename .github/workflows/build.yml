name: Build

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

permissions: read-all

jobs:
  compatibility:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"
      - name: Verify the pinned interpreter
        run: test "$(go list -m -f '{{.Version}}' go.starlark.net)" = "v0.0.0-20260324133313-ffb3f39dd27a"

  ci:
    permissions:
      contents: read
      id-token: write
    # Reusable CI lives in 1set/meta — the single source of truth for every
    # Star* module's pipeline. Pinned to a commit SHA for supply-chain safety;
    # bump the pin when meta's workflow changes (Dependabot github-actions can
    # automate this).
    uses: 1set/meta/.github/workflows/go-ci.yml@496f38088eff1a37bae1b43d158146a8a9d83a37
    with:
      # Preserve the established Go 1.19 library compatibility baseline.
      go-floor: "1.19"
      # Test-coverage ratchet (covcheck). Current total is ~99.2%; this floor
      # is intentionally conservative and can be tightened once CI reports the
      # first authoritative number. starbox is a host-runtime library, not a
      # script-builtin domain module, so doc-coverage and footprint stay off.
      cov-min: 95
    secrets: inherit
